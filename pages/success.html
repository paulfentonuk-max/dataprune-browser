<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful - DataPrune</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #05070a;
      color: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 500px;
      padding: 40px;
    }
    .icon {
      width: 80px;
      height: 80px;
      background: #22c55e;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 30px;
      font-size: 40px;
    }
    h1 {
      font-size: 32px;
      font-weight: 300;
      margin-bottom: 20px;
    }
    p {
      color: #8a94a8;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .btn {
      display: inline-block;
      padding: 15px 30px;
      background: #00d4ff;
      color: #05070a;
      text-decoration: none;
      font-weight: 600;
      border-radius: 6px;
    }
    .license-key {
      background: rgba(0, 212, 255, 0.1);
      border: 1px solid rgba(0, 212, 255, 0.3);
      padding: 20px;
      margin: 20px 0;
      border-radius: 8px;
      font-family: monospace;
      font-size: 14px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">✓</div>
    <h1>Welcome to DataPrune Premium!</h1>
    <p>Your payment was successful. Your license key has been sent to your email.</p>
    <div class="license-key" id="license-key">Loading...</div>
    <p>The extension will automatically activate. You can now close this tab.</p>
    <a href="https://dataprune.co/dashboard" class="btn">Go to Dashboard</a>
  </div>
  
  <script>
    // Extract license from URL or check storage
    const urlParams = new URLSearchParams(window.location.search);
    const license = urlParams.get('license');
    if (license) {
      document.getElementById('license-key').textContent = license;
      // Store in extension
      chrome.runtime.sendMessage({
        type: 'ACTIVATE_LICENSE',
        licenseKey: license
      });
    }
  </script>
</body>
</html>
