<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 380px; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1320;
      color: #f0f2f5;
    }
    .header { 
      padding: 20px; 
      background: linear-gradient(135deg, #0d1320, #0a0f1a);
      border-bottom: 1px solid rgba(0, 212, 255, 0.1);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      width: 40px;
      height: 40px;
      background: #00d4ff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo i { color: #05070a; font-size: 20px; }
    .title { flex: 1; }
    .title h1 { font-size: 16px; font-weight: 500; margin-bottom: 2px; }
    .title span { font-size: 11px; color: #00d4ff; letter-spacing: 1px; }
    .status {
      padding: 4px 10px;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #22c55e;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 4px;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 20px;
    }
    .metric {
      text-align: center;
      padding: 15px 10px;
      background: rgba(0, 212, 255, 0.05);
      border: 1px solid rgba(0, 212, 255, 0.1);
      border-radius: 8px;
    }
    .metric-value { font-size: 24px; color: #00d4ff; font-weight: 300; }
    .metric-label { font-size: 10px; color: #8a94a8; text-transform: uppercase; margin-top: 4px; }
    .features { padding: 0 20px 20px; }
    .feature {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(0, 212, 255, 0.05);
      font-size: 13px;
    }
    .feature:last-child { border-bottom: none; }
    .feature i { color: #00d4ff; font-size: 12px; }
    .feature.locked { color: #8a94a8; }
    .feature.locked i { color: #8a94a8; }
    .upgrade {
      margin: 0 20px 20px;
      padding: 15px;
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(0, 212, 255, 0.05));
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 8px;
      text-align: center;
    }
    .upgrade p { font-size: 12px; color: #8a94a8; margin-bottom: 10px; }
    .upgrade strong { color: #00d4ff; }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      background: #00d4ff;
      color: #05070a;
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }
    .patent {
      text-align: center;
      padding: 10px;
      font-size: 9px;
      color: rgba(138, 148, 168, 0.5);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="header">
    <div class="logo"><i class="fas fa-shield-alt"></i></div>
    <div class="title">
      <h1>DataPrune™</h1>
      <span>AROL™ Active</span>
    </div>
    <div class="status">Protected</div>
  </div>
  
  <div class="metrics">
    <div class="metric">
      <div class="metric-value" id="token-reduction">90%</div>
      <div class="metric-label">Token Reduction</div>
    </div>
    <div class="metric">
      <div class="metric-value" id="energy-saved">60%</div>
      <div class="metric-label">Energy Saved</div>
    </div>
    <div class="metric">
      <div class="metric-value" id="latency">&lt;50ms</div>
      <div class="metric-label">Latency</div>
    </div>
  </div>
  
  <div class="features">
    <div class="feature"><i class="fas fa-check-circle"></i> AROL™ Optimization Active</div>
    <div class="feature"><i class="fas fa-check-circle"></i> PII Detection</div>
    <div class="feature locked"><i class="fas fa-lock"></i> SecureBridge™ (Pro)</div>
    <div class="feature locked"><i class="fas fa-lock"></i> MTAVS™ (Pro)</div>
  </div>
  
  <div class="upgrade">
    <p>Upgrade to <strong>Professional</strong> for unlimited requests</p>
    <button class="btn" id="upgrade-btn">View Plans</button>
  </div>
  
  <div class="patent">Patent Pending • GB2620950.2</div>
  
  <script src="popup.js"></script>
</body>
</html>
